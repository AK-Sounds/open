name: Audio regression checks

on:
  push:
    branches: [main, engineering-hardening]
  pull_request:

permissions:
  contents: read

concurrency:
  group: audio-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Load original musical baseline
        run: git show 8a2d9c747ce1e31f48753169240c1393a422d028:player.js > "$RUNNER_TEMP/open-baseline.js"
      - name: Run lifecycle and audio-format regressions
        run: npm test
        env:
          OPEN_BASELINE: ${{ runner.temp }}/open-baseline.js
      - name: Install browser
        run: npx playwright install --with-deps chromium --only-shell
      - name: Run native browser checks
        run: npm run test:browser
